# 默认使用「宿主机先打包 + Docker 运行」，避免 Docker 内拉 Maven 依赖失败
# 详见 docker/DEPLOY.cn.md

services:
  kkfileview:
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
      args:
        KKFILEVIEW_VERSION: "5.0.0"
        RUNTIME_BASE: eclipse-temurin:21-jre-jammy
        SKIP_BASE_SETUP: "false"
    image: kkfileview:5.0.0
    container_name: kkfileview
    ports:
      - "${KK_HOST_PORT:-8012}:8012"
    environment:
      KK_SERVER_PORT: "8012"
      # 信任所有外部文件源（与 application.properties 中 trust.host=* 等效）
      KK_TRUST_HOST: "*"
    volumes:
      - kkfileview-file:/opt/kkFileView-5.0.0/file
      - kkfileview-log:/opt/kkFileView-5.0.0/log
      # 挂载本地配置，改 application.properties 后 docker compose restart 即可生效（无需重新打包镜像）
      - ./server/src/main/config/application.properties:/opt/kkFileView-5.0.0/config/application.properties:ro
    restart: unless-stopped

volumes:
  kkfileview-file:
  kkfileview-log:
